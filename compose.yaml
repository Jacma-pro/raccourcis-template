services:
  backend:
    build:
      context: ./backend
    ports:
      - "5001:5000"
    volumes:
      - ./content:/content
  
  frontend:
    build:
      context: ./frontend
    ports:
      - "5173:5173"
    environment:
      API_PROXY_TARGET: http://backend:5000
    depends_on:
      - backend